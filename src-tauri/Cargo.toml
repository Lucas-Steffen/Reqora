[package]
name = "reqora"
version = "0.1.0"
description = "An API workspace with local project search"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reqora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
keyring = "4"
aes-gcm = "0.10.3"
rand = "0.9.5"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
