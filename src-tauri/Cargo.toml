[package]
name = "reqora"
version = "0.1.0"
description = "An API workspace with local project search"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reqora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
keyring = "4"
aes-gcm = "0.10.3"
rand = "0.9.5"
base64 = "0.23.1"
# HTTP sending (http::send). TLS through SChannel and the Windows certificate store (ADR-011).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "stream", "gzip", "brotli", "deflate", "multipart"] }
native-tls = "0.2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures-util = { version = "0.3", default-features = false }

# DPAPI, only to open the secrets of the Electron profile (migrate::secrets).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
